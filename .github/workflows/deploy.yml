name: Deploy su Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: animalslave-pitfight
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i secret
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Mancano i secret CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID: deploy saltato."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Crea il progetto Pages (solo la prima volta)
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages project create "$PROJECT" --production-branch=main || echo "Progetto già esistente"

      - name: Pubblica la cartella public
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@3 pages deploy public --project-name="$PROJECT" --branch=main
